name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bundle
      - run: gh release create "$GITHUB_REF_NAME" abaninja-mcp.mcpb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
